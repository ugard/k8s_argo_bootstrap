apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: openarchiver
spec:
  # No PVC here, so the default RollingUpdate is fine.
  # 0 since 2026-07-30: this exists only to serve openarchiver, which is stopped.
  replicas: 0
  selector:
    matchLabels:
      app: tika
      namespace: openarchiver
  template:
    metadata:
      labels:
        app: tika
        namespace: openarchiver
    spec:
      containers:
      - name: tika
        image: apache/tika:3.2.2.0-full
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 9998
