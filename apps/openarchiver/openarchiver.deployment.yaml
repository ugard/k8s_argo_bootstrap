apiVersion: apps/v1
kind: Deployment
metadata:
  name: openarchiver
  namespace: openarchiver
spec:
  # Kept explicit so Argo owns the field: without it the replica count is
  # unmanaged and a manual `scale --replicas=0` survives every sync, which is
  # how this app sat dormant from 2026-01-18.
  #
  # Stopped 2026-07-30. apps/mailarchive now holds the archive, so this app has
  # no job left to do. It is scaled down rather than deleted: the PVCs, the
  # SealedSecret and the Ingress stay, so putting this back to 1 is the whole
  # of the rollback. Retiring it for good is still a separate decision.
  replicas: 0
  # openarchiver-data is ReadWriteOnce, so a RollingUpdate deadlocks: the new
  # pod lands on another node and hits Multi-Attach while the old one still
  # holds the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openarchiver
      namespace: openarchiver
  template:
    metadata:
      labels:
        app: openarchiver
        namespace: openarchiver
    spec:
      containers:
      - name: openarchiver
        # Pinned instead of :latest — the floating tag makes every pod restart a
        # silent, unreviewed upgrade. v0.5.2 is what :latest resolved to on
        # 2026-07-29 (same digest sha256:3d756fa1…).
        image: logiclabshq/open-archiver:v0.5.2
        # One container runs eight node processes: frontend, backend, three
        # workers and the pnpm/concurrently supervisors nesting them, which cost
        # ~500Mi on their own before any work happens. At 1Gi the cgroup sat at
        # 92% idle and peaked at 992Mi, so a 500-email indexing batch tipped it
        # over -- OOMKilled mid-POST, which is what left Meilisearch parsing a
        # JSON body truncated at 4MiB, and what orphaned the in-flight IMAP jobs
        # that BullMQ then reported as stalled.
        resources:
          requests:
            memory: "1Gi"
          limits:
            memory: "3Gi"
        ports:
        - containerPort: 3000
        - containerPort: 4000
        # The container runs frontend, backend and three workers under
        # `concurrently`, which keeps going when one of them dies. On this
        # deploy the backend exited because Meilisearch was still crashlooping,
        # and the pod stayed Running 1/1 while every API call 500'd. Probing
        # 4000 rather than the frontend on 3000 is what makes that visible.
        # A cold start after a long shutdown takes minutes -- the workers drain
        # their backlog while the backend is still coming up, and a plain
        # initialDelaySeconds on the liveness probe killed the container before
        # it ever bound. startupProbe holds liveness off for up to 5 minutes and
        # then hands over; a warm restart binds in about 4 seconds.
        startupProbe:
          httpGet:
            path: /
            port: 4000
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          periodSeconds: 30
          failureThreshold: 3
        envFrom:
        - secretRef:
            name: openarchiver
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT_BACKEND
          value: "4000"
        - name: PORT_FRONTEND
          value: "3000"
        - name: JWT_EXPIRES_IN
          value: "7d"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: openarchiver
              key: DATABASE_URL
        - name: REDIS_HOST
          value: "valkey"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_TLS_ENABLED
          value: "false"
        - name: MEILI_HOST
          value: "http://meilisearch:7700"
        - name: MEILI_INDEXING_BATCH
          value: "500"
        - name: STORAGE_TYPE
          value: "local"
        - name: STORAGE_LOCAL_ROOT_PATH
          value: "/var/data/openarchiver"
        - name: TIKA_URL
          value: "http://tika:9998"
        - name: ENABLE_DELETION
          value: "false"
        - name: SYNC_FREQUENCY
          value: "* * * * *"
        - name: BODY_SIZE_LIMIT
          value: "100M"
        - name: RATE_LIMIT_WINDOW_MS
          value: "60000"
        - name: RATE_LIMIT_MAX_REQUESTS
          value: "100"
        volumeMounts:
        - name: data
          mountPath: /var/data/openarchiver
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openarchiver-data
