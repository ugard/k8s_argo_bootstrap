apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: openarchiver
spec:
  # 0 since 2026-07-30: this exists only to serve openarchiver, which is stopped.
  replicas: 0
  # openarchiver-meilidata is ReadWriteOnce — see openarchiver.deployment.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
      namespace: openarchiver
  template:
    metadata:
      labels:
        app: meilisearch
        namespace: openarchiver
    spec:
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.15
        resources:
          # 1Gi indexing budget + LMDB page cache and the HTTP workers on top.
          limits:
            memory: "3Gi"
          requests:
            memory: "1Gi"
        ports:
        - containerPort: 7700
        env:
        # Meilisearch sizes its indexing buffer at 2/3 of the RAM it *sees*, and
        # inside a container that is the node's 29Gi, not the cgroup limit -- so
        # it blows past any limit we set and gets OOMKilled seconds after start.
        # Raising the limit alone did not help (see 6c79240, 1Gi -> 2Gi); the
        # budget has to be capped explicitly.
        - name: MEILI_MAX_INDEXING_MEMORY
          value: "1Gi"
        - name: MEILI_MAX_INDEXING_THREADS
          value: "2"
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: openarchiver
              key: MEILI_MASTER_KEY
        volumeMounts:
        - name: meilidata
          mountPath: /meili_data
      volumes:
      - name: meilidata
        persistentVolumeClaim:
          claimName: openarchiver-meilidata
