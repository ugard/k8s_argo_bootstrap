# PVC jest RWO: RollingUpdate zakleszcza się na Multi-Attach, gdy nowy pod
# trafi na inny węzeł niż stary
deploymentStrategyType: Recreate
persistence:
  storageClassName: "rook-ceph-block"
config:
  existingSecret: firefly-iii-secret
image:
  tag: version-6.7.9
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
  hosts:
  - firefly.ugard.win
  tls:
  - hosts:
    - firefly.ugard.win
    secretName: tls-firefly-ingress-http
