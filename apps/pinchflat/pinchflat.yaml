apiVersion: v1
kind: Service
metadata:
  name: pinchflat
  namespace: jellyfin
  labels:
    app: pinchflat
spec:
  # kontener pinchflat siedzi w podzie jellyfin (apps/jellyfin/values.yaml)
  selector:
    app.kubernetes.io/instance: kustomize-jellyfin
    app.kubernetes.io/name: jellyfin
  ports:
  - port: 8945
    targetPort: 8945
    name: web
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pinchflat
  namespace: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  rules:
  - host: pinchflat.ugard.win
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: pinchflat
              port:
                number: 8945
  tls:
  - hosts:
    - pinchflat.ugard.win
    secretName: tls-pinchflat-ingress-http
