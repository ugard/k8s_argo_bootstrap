---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          # SSO przez Authelię (client "grafana" w apps/authelia/configuration.yml)
          envFrom:
            - secretRef:
                # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, z scripts/create-oidc-client-secret.sh
                name: grafana-oidc
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.ugard.win"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "Authelia"
            - name: GF_AUTH_GENERIC_OAUTH_ICON
              value: "signin"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: "grafana"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email groups"
            - name: GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://auth.ugard.win/api/oidc/authorization"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "https://auth.ugard.win/api/oidc/token"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "https://auth.ugard.win/api/oidc/userinfo"
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: "preferred_username"
            - name: GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH
              value: "groups"
            - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
              value: "name"
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            # lldap_admin -> Admin (+ Grafana server admin), reszta -> Viewer
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'lldap_admin') && 'GrafanaAdmin' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            # od razu przekierowuj do Authelii; lokalny login: /login?disableAutoLogin
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: "https://auth.ugard.win/logout"
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              name: grafana-provisioning
              subPath: dashboards.yaml
            - mountPath: /var/lib/grafana/dashboards
              name: grafana-dashboards
            - mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              name: grafana-datasources
              subPath: datasources.yaml
      volumes:
        - name: grafana-pv
          emptyDir: 
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboard-storage
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grafana
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: http-grafana
  selector:
    app: grafana
  sessionAffinity: None
  # type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: grafana
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  rules:
  - host: grafana.ugard.win
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: grafana
              port:
                number: 3000
  tls:
  - hosts:
    - grafana.ugard.win
    secretName: tls-grafana-ingress-http