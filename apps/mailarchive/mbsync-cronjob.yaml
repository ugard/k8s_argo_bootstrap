apiVersion: batch/v1
kind: CronJob
metadata:
  name: mbsync
  namespace: mailarchive
spec:
  # Hourly. Anything finer buys nothing for an archive and multiplies the
  # number of IMAP logins against the providers.
  schedule: "0 * * * *"
  # Two mbsync processes on one Maildir is precisely the check-then-insert race
  # that left 211 duplicate Message-IDs in the OpenArchiver database. A slow
  # run must delay the next one, never overlap it.
  concurrencyPolicy: Forbid
  # If the controller was down over a scheduled slot, still run -- but do not
  # stampede through a backlog of missed slots after a long outage.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Without a TTL, failedJobsHistoryLimit keeps a failed Job (and its pod)
      # around indefinitely. A day is long enough to read the logs for a
      # post-mortem, and long enough that the kube_job_failed metric outlives
      # the "for: 5m" on the alert rule that watches it.
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # uid/gid 1000 is "vmail" in the Dovecot image. mbsync and Dovecot
            # must agree on ownership: mbsync creates the folder directories,
            # and Dovecot then has to write its own index files and the Xapian
            # full-text index inside them.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: mbsync
              # Built from ssh://git@git.ugard.win/lkrzyzak/mbox_sync.git by
              # Drone: alpine:3.23 plus isync from the signed Alpine repository.
              # Still not an image off Docker Hub -- every mbsync image there is
              # a one-person build, and this container holds the passwords to
              # private mail -- but the package is now resolved once at build
              # time instead of on every hourly run, which takes an Alpine
              # mirror off the critical path and lets the container run
              # unprivileged from the start.
              #
              # Pinned to the commit SHA, not :latest. A floating tag makes
              # every pod restart a silent upgrade.
              image: registry.ugard.win/mbox_sync:217f6708
              # No root anywhere in this container now: the image declares
              # USER 1000 and the pod securityContext above says the same.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # ENTRYPOINT is already mbsync, so pass arguments only.
              args: ["-c", "/config/mbsyncrc", "-a"]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: data
                  mountPath: /srv/vmail
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: mbsync-config
            - name: secrets
              secret:
                secretName: mailarchive-imap
                # 0440 with fsGroup 1000: the files are owned root:1000, so the
                # unprivileged mbsync process can read them and nobody else can.
                defaultMode: 0440
                items:
                  - key: gmail
                    path: gmail
                  - key: o2
                    path: o2
            - name: data
              persistentVolumeClaim:
                claimName: mailarchive-data
