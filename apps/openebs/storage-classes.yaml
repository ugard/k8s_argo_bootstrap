apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv
parameters:
  recordsize: "128k"
  compression: "off"
  dedup: "off"
  fstype: "zfs"
  poolname: "wdc/talos"
allowVolumeExpansion: true
reclaimPolicy: Retain
provisioner: zfs.csi.openebs.io
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv-affinity
parameters:
  recordsize: "128k"
  compression: "off"
  dedup: "off"
  fstype: "zfs"
  poolname: "wdc/talos"
allowVolumeExpansion: true
reclaimPolicy: Retain
provisioner: zfs.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
---
# shared: "yes" przepuszcza verifyMount w zfs-localpv, ale dla datasetów drugi
# `mount -t zfs` i tak kończy się "already mounted" (2.9.0, Talos) — do współdzielenia
# danych między kontenerami trzeba jednego poda. Używana przez jellyfin/youtube-media.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv-shared
parameters:
  recordsize: "128k"
  compression: "off"
  dedup: "off"
  fstype: "zfs"
  poolname: "wdc/talos"
  shared: "yes"
allowVolumeExpansion: true
reclaimPolicy: Retain
provisioner: zfs.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
