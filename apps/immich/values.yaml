controllers:
  main:
    containers:
      main:
        image:
          # Chart 0.13.1 pins appVersion v3.0.0; this override carries both the
          # server and machine-learning images to the newest 3.x patch.
          tag: v3.0.3
        env:
          # REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          # IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          DB_HOSTNAME: "postgres"
          DB_USERNAME: "immich"
          DB_DATABASE_NAME: "immich"

immich:
  metrics:
    # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
    enabled: false
  persistence:
    # Main data store for all photos shared between different components.
    library:
      # Automatically creating the library volume is not supported by this chart
      # You have to specify an existing PVC to use
      existingClaim: immich-data-pvc
  # configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  #
  configuration: {}

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      # Optional: Set this to persistentVolumeClaim to keep job queues across
      # restarts. size/accessMode/storageClass only apply to that type — the
      # chart's schema rejects them next to emptyDir since 0.13.0.
      type: emptyDir

# Immich components

server:
  enabled: true
  controllers:
    main:
      # immich-data-pvc is ReadWriteOnce, so a RollingUpdate deadlocks: the new
      # pod lands on another node and hits Multi-Attach while the old one still
      # holds the volume. Recreate tears the old pod down first (brief downtime).
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
          env:
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: PG_USERNAME
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich
                  key: PG_DB_NAME
  nodeSelector:
    kubernetes.io/arch: "amd64"
  ingress:
    main:
      enabled: true
      annotations:
        # proxy-body-size is set to 0 to remove the body limit on file uploads
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
      hosts:
        - host: immich.ugard.win
          paths:
            - path: "/"
      tls:
      - hosts:
          - immich.ugard.win
        secretName: tls-immich-ingress-http
  probes:
    liveness:
      spec:
        failureThreshold: 90
    readiness:
      spec:
        failureThreshold: 90
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
  probes:
    liveness:
      spec:
        failureThreshold: 30
    readiness:
      spec:
        failureThreshold: 30
  persistence:
    cache:
      enabled: true
      # Optional: Set this to persistentVolumeClaim to avoid re-downloading the
      # ML models on every restart; size/accessMode/storageClass belong to that
      # type only and are schema-rejected next to emptyDir since 0.13.0.
      type: emptyDir
