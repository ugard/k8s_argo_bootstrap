apiVersion: apps/v1
kind: Deployment
metadata:
  name: stella-scope
  namespace: stella-scope
spec:
  replicas: 1
  # jeden zapisujący do SQLite na RWO PVC
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stella-scope
  template:
    metadata:
      labels:
        app: stella-scope
    spec:
      # wydanie upstream to tylko .deb amd64 (glibc >= 2.39)
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Brak oficjalnego obrazu: pobieramy .deb z GitHub release (sprawdzany
      # SHA256 z SHA256SUMS wydania) i trzymamy binarkę na PVC. Upgrade = nowa
      # wersja + suma w obu init-containerach i w command.
      - name: fetch
        image: alpine:3.23
        env:
        - name: VERSION
          value: "0.6.3"
        - name: SHA256
          value: "9236dcf8f5927a07c53bfd596e5ce1dc0b623b1423c4f80ac87d5bea55dfb178"
        command:
        - sh
        - -ec
        - |
          deb="/data/dl/stella-scope_${VERSION}_amd64.deb"
          [ -x "/data/bin/stella-scope-${VERSION}" ] && exit 0
          mkdir -p /data/dl
          if ! echo "${SHA256}  ${deb}" | sha256sum -c -s 2>/dev/null; then
            wget -q -O "${deb}" "https://github.com/3d3dcanada/stella-scope-community/releases/download/v${VERSION}/stella-scope_${VERSION}_amd64.deb"
            echo "${SHA256}  ${deb}" | sha256sum -c
          fi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
      - name: install
        image: debian:trixie-slim
        env:
        - name: VERSION
          value: "0.6.3"
        command:
        - sh
        - -ec
        - |
          bin="/data/bin/stella-scope-${VERSION}"
          if [ ! -x "${bin}" ]; then
            rm -rf /tmp/x && mkdir -p /tmp/x /data/bin
            dpkg-deb -x "/data/dl/stella-scope_${VERSION}_amd64.deb" /tmp/x
            cp /tmp/x/usr/bin/stella-scope "${bin}.tmp"
            chmod 755 "${bin}.tmp"
            mv "${bin}.tmp" "${bin}"
            rm -f /data/dl/*.deb
          fi
          mkdir -p /data/config /data/home
          [ -f /data/config/stella-scope.json ] || cp /seed/stella-scope.json /data/config/stella-scope.json
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: seed
          mountPath: /seed
        - name: tmp
          mountPath: /tmp
      containers:
      - name: stella-scope
        image: debian:trixie-slim
        command: ["/data/bin/stella-scope-0.6.3", "--config", "/data/config/stella-scope.json"]
        workingDir: /data
        env:
        - name: TZ
          value: "Europe/Warsaw"
        # ~/.config i ~/.local/share (modele 3D drukarek) lądują na PVC
        - name: HOME
          value: /data/home
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      # Stella Scope słucha tylko na 127.0.0.1 - nginx wystawia go na port 8080
      - name: proxy
        image: nginxinc/nginx-unprivileged:1.29-alpine
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /api/meta
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/meta
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        securityContext:
          # katalogi cache/pid obrazu należą do uid 101
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: seed
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: stella-scope-data
      - name: seed
        configMap:
          name: stella-scope
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stella-scope
  namespace: stella-scope
spec:
  selector:
    app: stella-scope
  ports:
  - port: 8080
    targetPort: http
    name: web
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stella-scope
  namespace: stella-scope
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
    # Stella Scope nie ma własnego logowania - SSO przez Authelię
    traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
spec:
  rules:
  - host: stella.ugard.win
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: stella-scope
              port:
                number: 8080
  tls:
  - hosts:
    - stella.ugard.win
    secretName: tls-stella-scope-ingress-http
