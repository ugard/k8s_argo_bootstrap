apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-healthcheck
  namespace: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-healthcheck
  namespace: velero
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-healthcheck
  namespace: velero
subjects:
  - kind: ServiceAccount
    name: velero-healthcheck
    namespace: velero
roleRef:
  kind: Role
  name: velero-healthcheck
  apiGroup: rbac.authorization.k8s.io
---
# Obraz z repo gitea lkrzyzak/velero-healthcheck (statyczna binarka Rust,
# FROM scratch). Które Schedule'e i dokąd pingować — annotacje
# healthchecks.ugard.win/* w schedules.yaml. Nieudany backup idzie jako
# <url>/fail do healthchecks; Job pada tylko, gdy sam healthcheck nie działa.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-healthcheck
  namespace: velero
spec:
  schedule: "0 * * * *" # Every hour
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Reap finished Jobs after a day, so a failed run cannot linger
      # indefinitely under failedJobsHistoryLimit. Long enough to keep the pod
      # logs around for a post-mortem.
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: velero-healthcheck
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: velero-healthcheck
              image: registry.ugard.win/velero-healthcheck:a28633e1
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
