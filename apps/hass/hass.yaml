apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: hass
spec:
  ports:
  - name: web
    port: 8123
  selector:
    app: home-assistant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: hass
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
      namespace: hass
  template:
    metadata:
      labels:
        app: home-assistant
        namespace: hass
    spec:
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.10.0
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 8123
        env:
        - name: TZ
          value: Europe/Warsaw
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /config/configuration.yaml
          subPath: configuration.yaml
          name: configmap-file
        - mountPath: /config/automations.yaml
          subPath: automations.yaml
          name: configmap-file
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: hass-ceph-pvc
      - name: configmap-file
        configMap:
          name: home-assistant-configmap
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: home-assistant-configmap
  namespace: hass
data:
  known_devices.yaml: |
  automations.yaml: |
    - alias: "Initialize all TRV calibration on startup"
      trigger:
        - platform: homeassistant
          event: start
      action:
        - delay:
            seconds: 15
        - repeat:
            for_each: >
              {{ states.number 
                 | selectattr('entity_id', 'search', '_local_temperature_calibration$')
                 | map(attribute='entity_id') 
                 | list }}
            sequence:
              - service: number.set_value
                target:
                  entity_id: "{{ repeat.item }}"
                data:
                  value: 0
    # SAT (pyotgw) nie wraca sam po zerwaniu polaczenia z relay otgw:7686.
    # Przeladowanie tylko gdy bramka nadaje ramki i nie czesciej niz co 30 min.
    - id: sat_reload_unavailable
      alias: "SAT: reload when unavailable"
      mode: single
      trigger:
        - platform: state
          entity_id: climate.living_room
          to: unavailable
          for: "00:10:00"
      condition:
        - condition: template
          value_template: "{{ states('sensor.otgw_last_frame') not in ['unavailable', 'unknown'] }}"
        - condition: template
          value_template: >
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
      action:
        - service: homeassistant.reload_config_entry
          target:
            entity_id: climate.living_room
    - id: sat_reload_not_controlling
      alias: "SAT: reload when boiler ignores its setpoint"
      mode: single
      trigger:
        - platform: template
          value_template: >
            {{ is_state('climate.living_room', 'heat')
               and state_attr('climate.living_room', 'setpoint') | float(0) >= 30
               and states('sensor.otgw_control_setpoint') | float(0) < 20 }}
          for: "00:10:00"
      condition:
        - condition: template
          value_template: "{{ states('sensor.otgw_last_frame') not in ['unavailable', 'unknown'] }}"
        - condition: template
          value_template: >
            {{ this.attributes.last_triggered is none
               or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
      action:
        - service: homeassistant.reload_config_entry
          target:
            entity_id: climate.living_room
  configuration.yaml: |-
    default_config:
    frontend:
      themes: !include_dir_merge_named themes
    automation: !include automations.yaml
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/8
    
    mqtt:
      sensor:
      - name: "Thermostat room temperature"
        state_topic: "events/central_heating/otmonitor/roomtemperature"
        unit_of_measurement: "°C"
        device_class: "temperature"
        value_template: "{{ value_json.value }}"
      - name: "Outside temperature"
        state_topic: "events/central_heating/otmonitor/outsidetemperature"
        unit_of_measurement: "°C"
        device_class: "temperature"
        value_template: "{{ value_json.value }}"
      - name: "OTGW control setpoint"
        unique_id: otgw_control_setpoint
        state_topic: "events/central_heating/otmonitor/controlsetpoint"
        unit_of_measurement: "°C"
        device_class: "temperature"
        value_template: "{{ value_json.value }}"
      # kazda ramka OT; unavailable = bramka/USB/otmonitor nie nadaje
      - name: "OTGW last frame"
        unique_id: otgw_last_frame
        state_topic: "events/central_heating/otmonitor/Message"
        value_template: "{{ value_json.value }}"
        expire_after: 120
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hass-ceph-pvc
  namespace: hass
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 9Gi 
  storageClassName: rook-ceph-block