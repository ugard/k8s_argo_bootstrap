# Użycie w Ingress dowolnej aplikacji:
#   metadata:
#     annotations:
#       traefik.ingress.kubernetes.io/router.middlewares: authelia-forwardauth@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
