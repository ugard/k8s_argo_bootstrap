apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia
resources:
  - namespace.yaml
  # oba generowane przez scripts/create-authelia-sealed-secrets.sh
  - sealed_secret_authelia.yaml
  - sealed_secret_lldap.yaml
  - lldap.yaml
  - lldap-bootstrap.yaml
  - authelia.yaml
  - middleware.yaml
# hash w nazwie -> zmiana configu restartuje poda
configMapGenerator:
  - name: authelia-config
    files:
      - configuration.yml
  - name: lldap-bootstrap-users
    files:
      - bootstrap/users/authelia.json
  - name: lldap-bootstrap-groups
    files:
      - bootstrap/groups/homelab_users.json
