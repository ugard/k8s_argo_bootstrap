apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
spec:
  # sesje w pamięci (bez redisa) -> tylko jedna replika
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      # bez tego k8s wstrzykuje AUTHELIA_SERVICE_PORT itp., a Authelia traktuje
      # każdą zmienną AUTHELIA_* jako config i nie startuje
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Idempotentnie zakłada w LLDAP konto bind "authelia" (hasło z secretu
      # authelia) i grupę homelab_users, zanim Authelia zrobi startup check LDAP.
      # Celowo nie jako PostSync hook: ten czeka na zdrową aplikację, a Authelia
      # bez konta bind nie wstanie (zakleszczenie).
      initContainers:
      - name: lldap-bootstrap
        image: lldap/lldap:v0.6.3-alpine-rootless
        command: ["/app/bootstrap.sh"]
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: LLDAP_URL
          value: "http://lldap.authelia.svc.cluster.local:17170"
        - name: LLDAP_ADMIN_USERNAME
          value: "admin"
        - name: LLDAP_ADMIN_PASSWORD_FILE
          value: /secrets/lldap/LLDAP_LDAP_USER_PASS
        - name: USER_CONFIGS_DIR
          value: /bootstrap/user-configs
        - name: GROUP_CONFIGS_DIR
          value: /bootstrap/group-configs
        # nie usuwaj użytkowników/grup zakładanych ręcznie w UI
        - name: DO_CLEANUP
          value: "false"
        volumeMounts:
        - name: bootstrap-lldap-secret
          mountPath: /secrets/lldap
          readOnly: true
        - name: bootstrap-authelia-secret
          mountPath: /secrets/authelia
          readOnly: true
        - name: bootstrap-users
          mountPath: /bootstrap/user-configs
          readOnly: true
        - name: bootstrap-groups
          mountPath: /bootstrap/group-configs
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
      containers:
      - name: authelia
        image: ghcr.io/authelia/authelia:4.39.28
        args: ["--config", "/config/configuration.yml"]
        securityContext:
          allowPrivilegeEscalation: false
          # readOnlyRootFilesystem: true wywala startup checks Authelii 4.39 bez
          # żadnego komunikatu (sprawdzone lokalnie), więc zostaje wyłączone
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 9091
          name: http
        env:
        - name: TZ
          value: "Europe/Warsaw"
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
          value: /secrets/RESET_PASSWORD_JWT_SECRET
        - name: AUTHELIA_SESSION_SECRET_FILE
          value: /secrets/SESSION_SECRET
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
          value: /secrets/STORAGE_ENCRYPTION_KEY
        - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
          value: /secrets/STORAGE_PASSWORD
        - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
          value: /secrets/LDAP_PASSWORD
        # przy włączeniu OIDC (patrz configuration.yml):
        # - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
        #   value: /secrets/OIDC_HMAC_SECRET
        # - name: X_AUTHELIA_CONFIG_FILTERS
        #   value: template
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        # notification.txt (filesystem notifier)
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /api/health
            port: 9091
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9091
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9091
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: authelia-config
      - name: secrets
        secret:
          secretName: authelia
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: bootstrap-lldap-secret
        secret:
          secretName: lldap
          items:
          - key: LLDAP_LDAP_USER_PASS
            path: LLDAP_LDAP_USER_PASS
      - name: bootstrap-authelia-secret
        secret:
          secretName: authelia
          items:
          - key: LDAP_PASSWORD
            path: LDAP_PASSWORD
      - name: bootstrap-users
        configMap:
          name: lldap-bootstrap-users
      - name: bootstrap-groups
        configMap:
          name: lldap-bootstrap-groups
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
spec:
  type: ClusterIP
  selector:
    app: authelia
  ports:
  - name: http
    port: 9091
    targetPort: 9091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  rules:
  - host: auth.ugard.win
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: authelia
              port:
                number: 9091
  tls:
  - hosts:
    - auth.ugard.win
    secretName: tls-authelia-ingress-http
