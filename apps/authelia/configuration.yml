# authelia.yaml trzeba odkomentować env AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
# i X_AUTHELIA_CONFIG_FILTERS=template (potrzebny dla funkcji `secret` poniżej).
