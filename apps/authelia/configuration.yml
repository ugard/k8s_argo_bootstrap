# Authelia 4.39 - sekrety wchodzą przez zmienne *_FILE (patrz authelia.yaml),
# nic wrażliwego w tym pliku.
theme: auto

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth

log:
  level: info

totp:
  issuer: ugard.win

webauthn:
  display_name: ugard.win
  # logowanie samym passkeyem (pierwszy składnik). access_control używa
  # one_factor, więc passkey wystarcza (ale samo hasło też).
  enable_passkey_login: true
  attestation_conveyance_preference: indirect
  selection_criteria:
    user_verification: preferred
    discoverability: preferred

authentication_backend:
  password_reset:
    disable: false
  refresh_interval: 1m
  ldap:
    implementation: lldap
    address: 'ldap://lldap.authelia.svc.cluster.local:3890'
    base_dn: 'dc=ugard,dc=win'
    user: 'uid=authelia,ou=people,dc=ugard,dc=win'
    # password: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE

password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

access_control:
  default_policy: deny
  rules:
    # tylko aplikacje, których ingress ma middleware authelia-forwardauth@kubernetescrd
    - domain: '*.ugard.win'
      subject: 'group:lldap_admin'
      policy: one_factor
    - domain: '*.ugard.win'
      subject: 'group:homelab_users'
      policy: one_factor

session:
  # brak redisa -> sesje w pamięci, restart poda = ponowne logowanie
  # secret: AUTHELIA_SESSION_SECRET_FILE
  name: authelia_session
  expiration: 12h
  inactivity: 2h
  remember_me: 1M
  cookies:
    - domain: 'ugard.win'
      authelia_url: 'https://auth.ugard.win'
      default_redirection_url: 'https://home.ugard.win'

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 30m

storage:
  # encryption_key: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  postgres:
    address: 'tcp://postgres.postgres.svc.cluster.local:5432'
    database: authelia
    username: authelia
    # password: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE

notifier:
  # brak SMTP w klastrze - kody weryfikacyjne (rejestracja passkeya/TOTP, reset
  # hasła) lądują w pliku:
  #   kubectl -n authelia exec deploy/authelia -- cat /data/notification.txt
  filesystem:
    filename: /data/notification.txt

# OIDC. Plik przechodzi przez filtr template (X_AUTHELIA_CONFIG_FILTERS w
# authelia.yaml), stąd funkcja secret poniżej. Digesty sekretów klientów siedzą w
# secrecie authelia jako OIDC_CLIENT_<ID>_DIGEST - dodaje je
# scripts/create-oidc-client-secret.sh <client_id> ...
identity_providers:
  oidc:
    # hmac_secret: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/OIDC_JWKS_KEY" | mindent 10 "|" | msquote }}
    clients:
      - client_id: grafana
        client_name: Grafana
        client_secret: {{ secret "/secrets/OIDC_CLIENT_GRAFANA_DIGEST" | msquote }}
        public: false
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - 'https://grafana.ugard.win/login/generic_oauth'
        scopes: [openid, profile, groups, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      # Immich konfiguruje się w UI (Administration -> Settings -> Authentication),
      # sekret: ./view-secret-key.sh immich immich-oidc OAUTH_CLIENT_SECRET
      - client_id: immich
        client_name: Immich
        client_secret: {{ secret "/secrets/OIDC_CLIENT_IMMICH_DIGEST" | msquote }}
        public: false
        authorization_policy: one_factor
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://immich.ugard.win/auth/login'
          - 'https://immich.ugard.win/user-settings'
          # aplikacja mobilna
          - 'app.immich:///oauth-callback'
        scopes: [openid, profile, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
