# Idempotentnie zakłada w LLDAP konto serwisowe "authelia" (bind dla Authelii,
# hasło z secretu authelia) i grupę homelab_users. Uruchamiany po każdym syncu.
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: lldap/lldap:v0.6.3-alpine-rootless
        command: ["/app/bootstrap.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: LLDAP_URL
          value: "http://lldap:17170"
        - name: LLDAP_ADMIN_USERNAME
          value: "admin"
        - name: LLDAP_ADMIN_PASSWORD_FILE
          value: /secrets/lldap/LLDAP_LDAP_USER_PASS
        - name: USER_CONFIGS_DIR
          value: /bootstrap/user-configs
        - name: GROUP_CONFIGS_DIR
          value: /bootstrap/group-configs
        # nie usuwaj użytkowników/grup zakładanych ręcznie w UI
        - name: DO_CLEANUP
          value: "false"
        volumeMounts:
        - name: lldap-secret
          mountPath: /secrets/lldap
          readOnly: true
        - name: authelia-secret
          mountPath: /secrets/authelia
          readOnly: true
        - name: users
          mountPath: /bootstrap/user-configs
          readOnly: true
        - name: groups
          mountPath: /bootstrap/group-configs
          readOnly: true
      volumes:
      - name: lldap-secret
        secret:
          secretName: lldap
          items:
          - key: LLDAP_LDAP_USER_PASS
            path: LLDAP_LDAP_USER_PASS
      - name: authelia-secret
        secret:
          secretName: authelia
          items:
          - key: LDAP_PASSWORD
            path: LDAP_PASSWORD
      - name: users
        configMap:
          name: lldap-bootstrap-users
      - name: groups
        configMap:
          name: lldap-bootstrap-groups
