apiVersion: apps/v1
kind: Deployment
metadata:
  name: dorota-site
  namespace: dorota-site
  labels:
    app: dorota-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dorota-site
  template:
    metadata:
      labels:
        app: dorota-site
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: nginx
        # Hugo -> nginx, źródło: git.ugard.win/lkrzyzak/dorota-site (build: Drone CI)
        image: registry.ugard.win/dorota-site:dd2fa0f0
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dorota-site
  namespace: dorota-site
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: dorota-site
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dorota-site
  namespace: dorota-site
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
spec:
  rules:
  - host: dorota.ugard.win
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: dorota-site
              port:
                number: 80
  tls:
  - hosts:
    - dorota.ugard.win
    secretName: tls-dorota-site-ingress-http
