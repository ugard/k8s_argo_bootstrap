apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: broker
      namespace: paperless
  template:
    metadata:
      labels:
        app: broker
        namespace: paperless
    spec:
      containers:
      - name: broker
        image: docker.io/library/redis:7
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: gotenberg
      namespace: paperless
  template:
    metadata:
      labels:
        app: gotenberg
        namespace: paperless
    spec:
      containers:
      - name: gotenberg
        image: docker.io/gotenberg/gotenberg:8.7
        command: [ "gotenberg" ]
        args:
        - "--chromium-disable-javascript=true"
        - "--chromium-allow-list=file:///tmp/.*"
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: tika
      namespace: paperless
  template:
    metadata:
      labels:
        app: tika
        namespace: paperless
    spec:
      containers:
      - name: tika
        # 3.3.1.0 is exactly what :latest resolved to while this was running, so
        # pinning changes nothing today -- it only stops the next node reboot
        # from turning a pod restart into an unplanned upgrade, which is what
        # happened to the webserver above.
        image: docker.io/apache/tika:3.3.1.0
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 9998
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver
  namespace: paperless
spec:
  # paperless-data, paperless-media and paperless-export are all ReadWriteOnce
  # on rook-ceph-block, so the default RollingUpdate deadlocks: the new pod is
  # scheduled to another node and sits in ContainerCreating with Multi-Attach
  # while the old pod, which has to die first, is still holding the volumes.
  # Only paperless-consume is RWX. Recreate is the one strategy that works here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webserver
      namespace: paperless
  template:
    metadata:
      labels:
        app: webserver
        namespace: paperless
    spec:
      containers:
      - name: webserver
        # Pinned, not :latest. On 2026-07-28 talos-jly-e8b rebooted, the pod was
        # recreated, and :latest silently pulled 3.0.4 -- a major jump from the
        # 2.x that had been running. 3.x makes an unset PAPERLESS_SECRET_KEY a
        # hard error instead of a warning, so the webserver crash-looped for two
        # and a half days. The 2.x -> 3.x migrations never ran (the crash is at
        # settings import, before init-migrations), so the database was still on
        # the 2.x schema and this pin is a clean restore rather than a rollback.
        # Moving to 3.x is a deliberate change: dump the database first.
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
        resources:
          limits:
            memory: "2Gi"
        ports:
        - containerPort: 8000
        env:
        - name: PAPERLESS_REDIS
          value: redis://broker:6379
        - name: PAPERLESS_TIKA_ENABLED
          value: "1"
        - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
          value: "http://gotenberg:3000"
        - name: PAPERLESS_TIKA_ENDPOINT
          value: "http://tika:9998"
        - name: PAPERLESS_OCR_LANGUAGES
          value: pol
        - name: PAPERLESS_OCR_LANGUAGE
          value: pol
        - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
          value: "true"
        - name: PAPERLESS_CONSUMER_POLLING
          value: "15"
        - name: PAPERLESS_AUTO_LOGIN_USERNAME
          value: "admin"
        - name: PAPERLESS_URL
          value: https://paperless.ugard.win
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Warsaw
        - name: PAPERLESS_DBHOST
          value: postgres.postgres
        - name: PAPERLESS_DBNAME
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: POSTGRES_DB
        - name: PAPERLESS_DBUSER
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: POSTGRES_USER
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: POSTGRES_PASSWORD
        - name: PAPERLESS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: PAPERLESS_ADMIN_USER
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: PAPERLESS_ADMIN_PASSWORD
        # Until 2026-07-30 this was never set, so paperless fell back to its
        # built-in default key. That is what 3.x refuses to start on. It also
        # encrypts the stored mail-account passwords, so switching to a real key
        # invalidates them -- the two existing accounts need their passwords
        # re-entered in the UI once. Documents are not affected.
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: postgresdb
              key: PAPERLESS_SECRET_KEY
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: export
          mountPath: /usr/src/paperless/export
        - name: consume
          mountPath: /usr/src/paperless/consume
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - name: export
        persistentVolumeClaim:
          claimName: paperless-export
      - name: consume
        persistentVolumeClaim:
          claimName: paperless-consume
      