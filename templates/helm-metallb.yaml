apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
  - chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.15.3
    helm:
      releaseName: metallb
      valuesObject:
        speaker:
          frr:
            enabled: true
          # 95t to jedyny węzeł bez etykiety exclude-from-external-load-balancers
          # (Talos nadaje ją CP i sam ją odtwarza), więc ogłasza wszystkie VIP-y L2.
          # Ma taint dedicated=backup — speaker musi go tolerować, inaczej znika DNS.
          tolerations:
            - key: dedicated
              operator: Equal
              value: backup
  - repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: apps/metallb
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
