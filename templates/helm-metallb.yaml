apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
  - chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.15.3
    helm:
      releaseName: metallb
      valuesObject:
        speaker:
          frr:
            enabled: true
  # VIP-y L2 ogłaszają m920q/i8d/k1y: Talos ma tam w machine.nodeLabels usuniętą
  # etykietę exclude-from-external-load-balancers (domyślną dla CP, Talos ją odtwarza).
  # 95t (taint dedicated=backup) ma ją ustawioną na "true" i nie ma speakera.
  - repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: apps/metallb
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
