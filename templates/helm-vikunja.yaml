apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vikunja
  namespace: argocd
spec:
  destination:
    namespace: vikunja
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
  - repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: apps/vikunja
  - repoURL: oci://ghcr.io/go-vikunja/helm-chart/vikunja
    targetRevision: 2.6.0
    path: .
    helm:
      release-name: vikunja
      valuesObject:
        vikunja:
          # chart 2.x domyślnie używa SQLite (z własnym PVC) — bez tego Vikunja
          # wstałaby z pustą bazą zamiast naszej w postgres.postgres
          env:
            VIKUNJA_DATABASE_TYPE: postgres
            VIKUNJA_DATABASE_NAME: vikunja
          persistence:
            database:
              enabled: false
          configMaps:
            config:
              enabled: true
              data:
                config.yml: |
                  service:
                    # od 1.0 CORS jest domyślnie włączony i bez publicurl Vikunja nie startuje
                    publicurl: "https://vikunja.ugard.win"
          ingress:
            main:
              enabled: true
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
              hosts:
                - host: vikunja.ugard.win
                  paths:
                    - path: /
              tls:
                - hosts:
                  - vikunja.ugard.win
                  secretName: tls-vikunja-ingress-http
          # host/użytkownik/hasło bazy; Typesense usunięty w Vikunji 2.0 (wyszukiwanie idzie przez bazę)
          envFrom:
          - secretRef:
              name: vikunja


