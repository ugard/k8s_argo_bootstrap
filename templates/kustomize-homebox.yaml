apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-homebox
  namespace: argocd
spec:
  destination:
    namespace: homebox
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    path: apps/homebox
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}