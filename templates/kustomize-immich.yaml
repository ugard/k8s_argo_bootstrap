apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-immich
  namespace: argocd
spec:
  destination:
    namespace: immich
    server: {{ .Values.spec.destination.server }}
  project: default
  sources:
  # The classic Helm index stopped at 0.12.0; the chart moved to OCI publishing
  # in 0.13.0, so newer versions are only reachable this way (same pattern as
  # the vikunja app). 0.13.1 ships appVersion v3.0.0.
  - repoURL: oci://ghcr.io/immich-app/immich-charts/immich
    targetRevision: 0.13.1
    path: .
    helm:
      release-name: immich
      valueFiles:
      - $values/apps/immich/values.yaml
  - repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    ref: values
  - repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    path: apps/immich
