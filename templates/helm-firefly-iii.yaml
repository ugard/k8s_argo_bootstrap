apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firefly-iii
  namespace: argocd
spec:
  destination:
    namespace: firefly
    server: {{ .Values.spec.destination.server }}
  project: default
  ignoreDifferences:
    # Chart liczy APP_KEY przez `lookup`, ktore w `helm template` ArgoCD zwraca nil,
    # wiec przy kazdym renderze leci randAlphaNum 32 i Secret wiecznie migocze.
    # Efektywny APP_KEY i tak pochodzi z firefly-iii-secret (ostatni w envFrom).
    - group: ""
      kind: Secret
      name: firefly-iii-app-key
      namespace: firefly
      jsonPointers:
        - /data/APP_KEY
  sources:
    - chart: firefly-iii
      repoURL: https://firefly-iii.github.io/kubernetes
      targetRevision: 1.10.1
      helm:
        release-name: firefly
        valueFiles:
          - $values/apps/firefly/values.yaml
    - chart: importer
      repoURL: https://firefly-iii.github.io/kubernetes
      targetRevision: 1.6.0
      helm:
        release-name: firefly-importer
        valueFiles:
          - $values/apps/firefly/values-importer.yaml
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      ref: values
    - repoURL: {{ .Values.spec.source.repoURL }}
      targetRevision: {{ .Values.spec.source.targetRevision }}
      path: apps/firefly